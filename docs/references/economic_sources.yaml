economic_assumptions:
  scope: "EU-27 Aviation Decarbonization (2025-2050)"
  currency: "USD (Real 2024)"
  
  metrics:
    jet_a1_price:
      range: "$800 -> $950"
      source: "IATA Jet Fuel Price Monitor / Platts"
      link: "https://www.iata.org/en/publications/economics/fuel-monitor/"
      description: "Baseline fossil fuel price. Increase is driven by carbon pricing, not the commodity cost. 'Average jet fuel price for 2025 is forecast at $86/bbl'."
    
    hefa_saf_price:
      range: "$2,200 -> $1,850"
      source: "Argus Media / SkyNRG Outlook"
      link: "https://www.argusmedia.com/en/news-and-insights/latest-market-news"
      description: "Bio-based SAF price floor. 'HEFA prices in NW Europe hit ~$2,900/t in late 2024.' We use $2,200 as a conservative floor due to feedstock scarcity."
    
    ptl_saf_price:
      range: "$3,800 -> $1,200"
      source: "ICCT Waypoint 2050 / Bain"
      link: "https://theicct.org/publication/aviation-vision-2050-sept25/"
      description: "Power-to-Liquid e-fuels. Currently expensive (~13x Jet A-1), but 'production cost is expected to decrease to ~$1,200/t by 2050' as renewable energy scales."
    
    carbon_price_ets:
      range: "€90 -> €275"
      source: "EU Commission 'Fit for 55' Impact Assessment"
      link: "https://climate.ec.europa.eu/eu-action/european-green-deal/2030-climate-target-plan_en"
      description: "The penalty for fossil emissions. Free allowances for aviation drop to 0% by 2026. 'Carbon prices must rise to €200+ to drive decarbonization.'"
    
    hefa_supply_cap_eu:
      value: "5.0 Mt/year"
      source: "ICCT / IEA Bioenergy Task 39"
      link: "https://theicct.org/wp-content/uploads/2021/06/Sustainable-aviation-fuel-feedstock-eu-mar2021.pdf"
      description: "The 'Feedstock Wall'. Global waste oil is finite. 'We estimate sufficient resource base to support approx 3.4 Mt of advanced SAF annually in the EU.'"
    
    logistics_penalty:
      value: "$150 / tonne"
      source: "Internal Team S2 Calculation (Logistics Analysis)"
      link: "https://cavs.msstate.edu/publications/docs/2015/02/13104MarufEksiogluRafael_TRA2015.pdf"
      description: "Cost differential between decentralized trucking (S1) and centralized pipelines (S2 Book & Claim). Based on heavy-duty transport cost analysis."
    
    logistics_carbon_penalty:
      value: "50 gCO2 / t-km"
      source: "ICCT Heavy Duty Vehicle Emissions"
      link: "https://theicct.org/publication/co2-emissions-from-trucks-in-the-eu-an-analysis-of-the-heavy-duty-co2-standards-baseline-data/"
      description: "Emissions form fuel transport. 'Long-haul tractor-trailers emitted on average 57 gCO2/t-km.' Adjusted to 50g for model conservatism."
    
    smart_levy_rate:
      range: "€7.40 → €40 per passenger"
      source: "France airline ticket solidarity tax (TSBA)"
      link: "https://solidaritylevies.org/france-dashboard-profile/"
      description: >
        France applies a distance-based solidarity levy on airline tickets:
        €7.40 for domestic/intra-EEA economy up to €40 for long-haul economy.
        We use €15 per passenger as a central EU-wide Smart Levy level.
    
    eu27_air_passengers:
      range: "816m → 973m passengers/year"
      source: "Eurostat 'Air passenger transport statistics' (2022–2023)"
      link: "https://ec.europa.eu/eurostat/statistics-explained/index.php?title=Air_passenger_transport_statistics"
      description: >
        Eurostat reports 816 million air passengers in the EU in 2022 and
        973 million in 2023. We round to 1.0 billion passengers/year as a
        stable central estimate for 2026+ in the Smart Levy scenario.
    
    levy_to_saf_share:
      value: "80% of levy revenue"
      source: "Internal Smart Levy design choice"
      link: "https://example.com"
      description: >
        We assume 80% of levy proceeds are earmarked to close the SAF–kerosene
        price gap via producer subsidies. The remaining 20% covers administration
        and other climate spending.
    
    logistics_tkm_per_tonne:
      value: "1,000 t-km per tonne SAF"
      source: "Internal logistics modelling assumption"
      link: "https://cavs.msstate.edu/publications/docs/2015/02/13104MarufEksiogluRafael_TRA2015.pdf"
      description: >
        Approximates average long-haul ground transport distance per tonne of SAF
        from production sites to EU hubs. Combined with 50 gCO2/t-km to estimate
        logistics emissions and a logistics carbon penalty.
    
    hefa_global_supply_cap:
      range: "25 → 35 Mt/year"
      source: "ICCT / IEA Bioenergy Task 39 (global waste-oil limits)"
      link: "https://theicct.org/wp-content/uploads/2021/06/Sustainable-aviation-fuel-feedstock-eu-mar2021.pdf"
      description: >
        Analyses of global waste-oil feedstocks imply a total HEFA potential of a
        few tens of Mt of SAF per year worldwide. We choose 30 Mt/year as a
        central global cap, from which the 5 Mt/year EU HEFA cap is derived.

